<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobNest</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>JobNest</h1>
          <p id="summary">0 applications tracked</p>
        </div>
        <button id="openTrackerBtn" class="icon-button" type="button" title="Open tracker" aria-label="Open tracker">
          <span aria-hidden="true">Open</span>
        </button>
      </header>

      <section class="entry-panel" aria-labelledby="addJobTitle">
        <h2 id="addJobTitle">Add application</h2>
        <form id="jobForm" autocomplete="off">
          <div class="field-grid">
            <label>
              Company
              <input id="company" name="company" type="text" required placeholder="...">
            </label>
            <label>
              Role
              <input id="role" name="role" type="text" required placeholder="...">
            </label>
          </div>

          <label>
            Job URL
            <input id="url" name="url" type="url" placeholder="...">
          </label>

          <div class="field-grid">
            <label>
              Location
              <input id="location" name="location" type="text" placeholder="Remote">
            </label>
            <label>
              Status
              <select id="status" name="status">
                <option value="saved">Saved</option>
                <option value="applied">Applied</option>
                <option value="screening">Screening</option>
                <option value="interview">Interview</option>
                <option value="offer">Offer</option>
                <option value="rejected">Rejected</option>
              </select>
            </label>
          </div>

          <label>
            Status date
            <input id="appliedDate" name="appliedDate" type="date">
          </label>

          <label>
            Notes
            <textarea id="notes" name="notes" rows="3" placeholder="Recruiter name, salary, next step..."></textarea>
          </label>

          <button class="primary-button" type="submit">Save application</button>
        </form>
      </section>
    </main>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
