<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobNest Tracker</title>
    <link rel="stylesheet" href="tracker.css">
  </head>
  <body>
    <main class="tracker-shell">
      <header class="page-header">
        <div>
          <h1>Applications</h1>
          <p id="summary">0 applications tracked</p>
        </div>
        <div class="header-actions">
          <button id="statsBtn" class="secondary-button" type="button">View Stats</button>
          <button id="importBtn" class="secondary-button" type="button">Restore Backup</button>
          <button id="backupLocationBtn" class="secondary-button" type="button">Choose Backup File</button>
          <p id="importMessage" class="import-message" aria-live="polite"></p>
        </div>
      </header>

      <section id="backupGate" class="backup-gate" aria-labelledby="backupGateTitle" hidden>
        <div>
          <h2 id="backupGateTitle">Connect a backup file to continue</h2>
          <p id="backupGateMessage">JobNest needs a backup JSON file before you manage applications. If browser storage was cleared, restore your previous backup after connecting a backup file.</p>
        </div>
        <div class="backup-gate-actions">
          <button id="gateBackupBtn" class="secondary-button" type="button">Choose Backup File</button>
          <button id="gateRestoreBtn" class="secondary-button" type="button">Restore Backup</button>
        </div>
      </section>

      <section class="applications-section" aria-labelledby="applicationsTitle">
        <div class="applications-header">
          <h2 id="applicationsTitle">Saved jobs</h2>
          <label class="search-control" aria-label="Search applications">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="search" class="search-input" type="search" placeholder="Search company, role, or location">
          </label>
        </div>
        <div id="sectionsList" class="sections-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="statusSectionTemplate">
      <section class="status-section">
        <header class="status-header">
          <h3></h3>
          <span class="status-count"></span>
        </header>
        <div class="job-list"></div>
      </section>
    </template>

    <template id="jobItemTemplate">
      <article class="job-item">
        <div class="job-main">
          <div class="job-title-row">
            <h4></h4>
            <button class="edit-button" type="button" title="Edit application" aria-label="Edit application">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 20h9"></path>
                <path d="m16.5 3.5 4 4L8 20H4v-4L16.5 3.5z"></path>
              </svg>
            </button>
          </div>
          <p class="company-line"></p>
          <p class="meta-line"></p>
          <p class="notes-line"></p>
        </div>
        <div class="job-actions">
          <a class="open-link" target="_blank" rel="noreferrer">Open job</a>
          <button class="delete-button" type="button">Delete</button>
        </div>
      </article>
    </template>

    <dialog id="editDialog" class="edit-dialog" aria-labelledby="editDialogTitle">
      <form id="editForm" class="edit-form" method="dialog">
        <header class="edit-dialog-header">
          <h2 id="editDialogTitle">Edit application</h2>
          <button class="dialog-close-button" type="button" aria-label="Close editor"></button>
        </header>

        <input id="editId" name="id" type="hidden">

        <div class="edit-field-grid">
          <label>
            Company
            <input id="editCompany" name="company" type="text" required>
          </label>
          <label>
            Role
            <input id="editRole" name="role" type="text" required>
          </label>
        </div>

        <label>
          Job URL
          <input id="editUrl" name="url" type="url">
        </label>

        <div class="edit-field-grid">
          <label>
            Location
            <input id="editLocation" name="location" type="text">
          </label>
          <label>
            Status
            <select id="editStatus" name="status">
              <option value="saved">Saved</option>
              <option value="applied">Applied</option>
              <option value="screening">Screening</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
            </select>
          </label>
        </div>

        <label>
          Status date
          <input id="editAppliedDate" name="appliedDate" type="date">
        </label>

        <label>
          Notes
          <textarea id="editNotes" name="notes" rows="6"></textarea>
        </label>

        <footer class="edit-dialog-actions">
          <button class="secondary-button" type="button" data-dialog-cancel>Cancel</button>
          <button class="primary-button" type="submit">Save changes</button>
        </footer>
      </form>
    </dialog>

    <script src="storage.js"></script>
    <script src="tracker.js"></script>
  </body>
</html>
